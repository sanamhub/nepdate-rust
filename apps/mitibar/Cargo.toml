[package]
name = "mitibar"
version = "0.1.0-beta.1"
description = "MitiBar, a tray calendar widget for the nepdate crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sanamhub/nepdate-rust"
documentation = "https://github.com/sanamhub/nepdate-rust/tree/main/apps/mitibar"
keywords = ["nepali", "bikram-sambat", "calendar", "tray", "desktop"]
categories = ["gui", "date-and-time"]
readme = "README.md"
rust-version = "1.92" # Slint MSRV, higher than the libraries' 1.85
publish = false

[features]
# PNG encoding for the --snapshot and --bar-snapshot flags. `image` is
# already in the tree through i-slint-core, so this adds no new crate; only the `png` codec
# feature is enabled. Off by default: the shipped binary has no image crate (ADR-0016).
default = []
snapshot = ["dep:image"]

[dependencies]
# ADR-0018: software renderer only. The list is the old default set minus femtovg:
# std, winit (X11 and Wayland), software rendering, accessibility, the 1.2 compatibility
# surface, the tray type and `unstable-winit-030` for skip-taskbar and the window accessor.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
nepdate = { path = "../../crates/nepdate", features = ["jiff"] }
# Tithi, holidays and events for the month grid and day detail (ADR-0015).
nepdate-patro = { path = "../../crates/nepdate-patro" }
jiff = "0.2"
anyhow = "1"
# Settings file (ADR-0015): serde derive + TOML.
serde = { version = "1", features = ["derive"] }
toml = "1"
# Single instance over a local socket (ADR-0015).
interprocess = "2"
# Clipboard (WR-01 AC5). Already in the tree through Slint's winit backend, so no new crate;
# text-only, no image feature (ADR-0015).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Logging (ADR-0015): file logger + panic hook.
log = "0.4"
simplelog = "0.12"
dirs = "7"
# PNG encoding for the snapshot flags, behind the `snapshot` feature (ADR-0016).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
# Slint's headless testing backend for the interaction tests. It is an internal crate:
# the version must equal `slint` exactly (1.18.1 in Cargo.lock), hence the `=`.
i-slint-backend-testing = "=1.18.1"
# Temporary directories for the settings store tests.
tempfile = "3"

[build-dependencies]
slint-build = "1.18"
# Application manifest (ADR-0016): Windows 8 to 11 `supportedOS`, per-monitor-v2 DPI and the
# UTF-8 active code page. Layered windows need the `supportedOS` entry.
embed-manifest = "1.5"

[lints]
workspace = true

# Per-user launch at login on macOS and Linux (ADR-0015). Windows writes its `Run` value
# with `windows-registry` instead, so the path is quoted and Task Manager can disable it.
[target."cfg(not(windows))".dependencies]
auto-launch = "0.6"

[target."cfg(windows)".dependencies]
windows-registry = "0.6.1"
# Win32 and COM for the mini bar (ADR-0019). Only the features the module uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Accessibility",
] }
# `windows_numerics::Vector2` is the Direct2D `DrawTextLayout` origin type (via the `windows`
# crate); it is already in the tree through that dependency.
windows-numerics = "0.3"
