[package]
name = "nepdate-widget"
version = "0.0.0"
description = "Tray calendar widget for the nepdate crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92" # Slint MSRV, higher than the libraries' 1.85
publish = false

[dependencies]
# Default features (ADR-0010: femtovg renderer, winit backend, plus the software renderer for
# headless use), plus `unstable-winit-030` so the popup can opt out of the Windows taskbar
# (W1-04). No feature overrides: the plan (W0-01) spells `slint = "1.18"`.
slint = { version = "1.18", features = ["unstable-winit-030"] }
nepdate = { path = "../../crates/nepdate", features = ["jiff"] }
jiff = "0.2"
anyhow = "1"
# Clipboard (WR-01 AC5). Already in the tree through Slint's winit backend, so no new crate;
# text-only, no image feature (ADR-0015).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# PNG encoding for the --snapshot flag. `image` is already in the tree through i-slint-core, so
# this adds no new crate; only the `png` codec feature is enabled.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
