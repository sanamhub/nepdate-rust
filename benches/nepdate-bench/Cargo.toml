[package]
name = "nepdate-bench"
version = "0.0.0"
description = "B1 to B8 of shared/spec/BENCHMARK.md for nepdate and nepdate-patro"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nepdate = { path = "../../crates/nepdate" }
nepdate-patro = { path = "../../crates/nepdate-patro" }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "compare"
harness = false

[lints]
workspace = true
# No `[profile.release]` here: workspace profiles are read from the root only, and the root
# already sets `lto = "fat"` and `codegen-units = 1` (the settings ADR-0004 measured with).
