# One tag `nepdate-vX.Y.Z` releases `nepdate` then `nepdate-patro` (ADR-0012, ADR-0002).
# preflight -> ci -> publish -> verify-published. Published by crates.io trusted publishing; the
# first release uses a short-lived CARGO_REGISTRY_TOKEN instead, because crates.io attaches a
# trusted publisher only to a crate that exists. The `production` environment gates `publish`
# behind a maintainer approval. See docs/runbooks/release-library.md.

name: release-lib

on:
  push:
    tags: ["nepdate-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run everything except publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history, so the tagged commit can be checked against main below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      # The version comes from the tag (or Cargo.toml) and is validated before anything uses
      # it; later steps get it through env, never through ${{ }} inside a script, so a crafted
      # tag name can't inject shell.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#nepdate-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/nepdate/Cargo.toml | head -n1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like X.Y.Z or X.Y.Z-pre.N (tag nepdate-vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Release check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release-check nepdate "$VERSION"
      # semver-checks compares against the newest published version, so it has nothing to compare
      # until nepdate exists on crates.io (the first release, 0.1.0-beta.1).
      - name: Is nepdate on crates.io yet
        id: published
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'nepdate-rust release-lib' https://crates.io/api/v1/crates/nepdate)"
          echo "crates.io answered $status for nepdate"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            # Anything else would skip semver-checks on a guess.
            *) echo "::error::crates.io answered $status; can't tell whether nepdate exists"; exit 1 ;;
          esac
      - name: Install cargo-semver-checks
        if: steps.published.outputs.exists == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks
      - name: Semver checks
        if: steps.published.outputs.exists == 'true'
        run: cargo semver-checks -p nepdate -p nepdate-patro

  ci:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo xtask ci runs clippy on the whole workspace, MitiBar included, as ci.yml does.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-nextest
      - run: cargo xtask ci
      # Packages each crate from its packaged files only, so a missing `include` is caught.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo package -p nepdate -p nepdate-patro

  publish:
    needs: [preflight, ci]
    # Only from a tag: a manual run on a branch is always a dry run, so it can never publish or
    # create a GitHub release named after the branch.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      # First release only: crates.io cannot attach a trusted publisher to a crate that does not
      # exist yet, so a short-lived publish-new token in the production environment is used while it
      # is set. The runbook deletes it once trusted publishing is configured, and this fallback goes.
      - name: Token for the first release
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Using CARGO_REGISTRY_TOKEN from the production environment (first release)."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - id: auth
        if: steps.token.outputs.present != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # cargo publish waits until the index serves the version, so patro resolves its new core.
      - name: Publish nepdate
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'nepdate-rust release-lib' "https://crates.io/api/v1/crates/nepdate/${VERSION}")"
          if [ "$status" = "200" ]; then
            echo "nepdate ${VERSION} already published"
          else
            cargo publish -p nepdate
          fi
      - name: Publish nepdate-patro
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'nepdate-rust release-lib' "https://crates.io/api/v1/crates/nepdate-patro/${VERSION}")"
          if [ "$status" = "200" ]; then
            echo "nepdate-patro ${VERSION} already published"
          else
            cargo publish -p nepdate-patro
          fi
      - name: Build release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: cargo xtask changelog nepdate "${VERSION}" > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}

  verify-published:
    needs: [preflight, publish]
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
