# One tag `mitibar-vX.Y.Z` builds the widget on all three OSes and creates a DRAFT
# GitHub Release. Preflight is seconds; the build matrix packages NSIS on Windows, a universal
# .app/.dmg on macOS and .AppImage/.deb on Linux; checksums, a CycloneDX SBOM and build
# provenance attestations are attached. Signing is optional for 0.x and runs only when its
# repository variable is true (ADR-0012). Nothing here publishes: the maintainer installs the draft
# assets, ticks docs/runbooks/release-mitibar.md and publishes the draft.
#
# The static test in xtask/src/workflow.rs parses this file (not a regex) and checks the
# structure.

name: release-mitibar

on:
  push:
    tags: ["mitibar-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run everything except creating the draft release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-mitibar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      # The version comes from the tag (or Cargo.toml) and is validated before any later job
      # uses it; scripts read it from env, never from an expression, so a tag cannot inject shell.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#mitibar-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/mitibar/Cargo.toml | head -n1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like X.Y.Z or X.Y.Z-pre.N (tag mitibar-vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Release check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release-check mitibar "$VERSION"
      # Holidays must have 183 days; tithi and events only warn and are copied into the PR.
      - name: Data freshness gate
        run: cargo xtask data-status

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
          - os: macos-latest
            target: universal-apple-darwin
            arch: universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # cargo-packager is not in taiki-e/install-action's manifest list, so it builds once here.
      # The version is the ADR-0012 one; a newer release is a decision, not a float.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      # Build the Windows binary before packaging, so the signing step can sign the exact
      # file that NSIS and the portable zip carry. Both Windows arches cross-compile where needed.
      - name: Build the Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add $env:TARGET
          cargo build -p mitibar --profile release-widget --target $env:TARGET
      # macOS must ship one universal binary: build both arches and join them with lipo.
      - name: Build the universal macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build -p mitibar --profile release-widget --target aarch64-apple-darwin
          cargo build -p mitibar --profile release-widget --target x86_64-apple-darwin
          mkdir -p target/universal/release-widget
          lipo -create -output target/universal/release-widget/mitibar \
            target/aarch64-apple-darwin/release-widget/mitibar \
            target/x86_64-apple-darwin/release-widget/mitibar
      # Signing is optional for 0.x. These steps are skipped unless the repository variable is
      # true, so an unsigned preview is never faked as signed (ADR-0012).
      - name: Sign Windows binary
        if: matrix.os == 'windows-latest' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          MITIBAR_BINARY: target/${{ matrix.target }}/release-widget/mitibar.exe
          SIGNING_CERT_SHA1: ${{ secrets.WINDOWS_SIGNING_CERT_SHA1 }}
        run: |
          if (-not $env:SIGNING_CERT_SHA1) { throw "WINDOWS_SIGNING_ENABLED is true but WINDOWS_SIGNING_CERT_SHA1 is empty" }
          if (-not (Test-Path $env:MITIBAR_BINARY)) { throw "the Windows binary is missing: $env:MITIBAR_BINARY" }
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:SIGNING_CERT_SHA1 $env:MITIBAR_BINARY
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for $env:MITIBAR_BINARY" }
      # The xtask uses the already built binary; ARM64 needs --target so cargo-packager names
      # the installer arm64, and MITIBAR_ARCH names the portable zip.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        env:
          MITIBAR_BINARIES_DIR: target/${{ matrix.target }}/release-widget
          MITIBAR_TARGET: ${{ matrix.target }}
          MITIBAR_ARCH: ${{ matrix.arch }}
        run: cargo xtask package
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo xtask package
      # Package the .app only, sign it, then build the DMG around the signed bundle.
      - name: Package (macOS app)
        if: matrix.os == 'macos-latest'
        env:
          MITIBAR_BINARIES_DIR: target/universal/release-widget
          MITIBAR_PACKAGE_FORMATS: app
        run: cargo xtask package
      - name: Sign macOS app
        if: matrix.os == 'macos-latest' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "::error::MACOS_SIGNING_ENABLED is true but MACOS_SIGNING_IDENTITY is empty"
            exit 1
          fi
          test -d dist/MitiBar.app
          codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" dist/MitiBar.app
          codesign --verify --strict --verbose=2 dist/MitiBar.app
      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -d dist/MitiBar.app
          hdiutil create -volname "MitiBar" -srcfolder dist/MitiBar.app -ov -format UDZO \
            "dist/MitiBar-${VERSION}.dmg"
      - name: Notarize and staple macOS DMG
        if: matrix.os == 'macos-latest' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="dist/MitiBar-${VERSION}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Sign Windows installer
        if: matrix.os == 'windows-latest' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_SHA1: ${{ secrets.WINDOWS_SIGNING_CERT_SHA1 }}
        run: |
          if (-not $env:SIGNING_CERT_SHA1) { throw "WINDOWS_SIGNING_ENABLED is true but WINDOWS_SIGNING_CERT_SHA1 is empty" }
          $installer = Get-ChildItem dist -Filter *-setup.exe
          if (-not $installer) { throw "no NSIS installer in dist" }
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:SIGNING_CERT_SHA1 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($installer.Name)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path apps/mitibar/Cargo.toml --format json \
            --spec-version 1.5 --override-filename "MitiBar-${VERSION}"
          mkdir -p sbom
          find . -name "MitiBar-${VERSION}*.cdx.json" -print -quit | xargs -r -I{} cp {} sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error

  checksums:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  # Least privilege: id-token and attestations only on this job, never on build or release.
  attest:
    needs: [build, checksums, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

  release:
    needs: [preflight, checksums, attest]
    # A manual run on a branch never creates a release. A tag created by the maintainer does; the
    # dry-run input only affects workflow_dispatch, where the default is true.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Build release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          cargo xtask changelog mitibar "$VERSION" > notes.md
          if [[ "$WINDOWS_SIGNING_ENABLED" != "true" || "$MACOS_SIGNING_ENABLED" != "true" ]]; then
            printf '\n> This preview is unsigned. Windows SmartScreen and macOS Gatekeeper will warn.\n' >> notes.md
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          draft: true
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}
          files: artifacts/*
