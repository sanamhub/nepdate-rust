# W4-04: one tag `mitibar-vX.Y.Z` builds the widget on all three OSes and creates a DRAFT
# GitHub Release. Preflight is seconds; the build matrix packages NSIS on Windows, a universal
# .app/.dmg on macOS and .AppImage/.deb on Linux; checksums, a CycloneDX SBOM and build
# provenance attestations are attached. Signing is optional for 0.x and runs only when its
# repository variable is true (ADR-0012). Nothing here publishes: a human installs the draft
# assets, ticks docs/runbooks/release-mitibar.md and publishes the draft.
#
# It cannot run in this repository until a GitHub remote exists. The static test in
# xtask/src/workflow.rs parses this file (not a regex) and checks the structure.

name: release-mitibar

on:
  push:
    tags: ["mitibar-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run everything except creating the draft release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-mitibar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
      # The version comes from the tag (or Cargo.toml) and is validated before any later job
      # uses it; scripts read it from env, never from an expression, so a tag cannot inject shell.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#mitibar-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/mitibar/Cargo.toml | head -n1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like X.Y.Z or X.Y.Z-pre.N (tag mitibar-vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Release check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release-check mitibar "$VERSION"
      # W4-00: holidays must have 183 days; tithi and events only warn and are copied into the PR.
      - name: Data freshness gate
        run: cargo xtask data-status

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      # cargo-packager is not in taiki-e/install-action's manifest list, so it builds once here.
      # The version is the ADR-0012 one; a newer release is a decision, not a float.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      # macOS must ship one universal binary: build both arches and join them with lipo.
      - name: Build the universal macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build -p mitibar --profile release-widget --target aarch64-apple-darwin
          cargo build -p mitibar --profile release-widget --target x86_64-apple-darwin
          mkdir -p target/universal/release-widget
          lipo -create -output target/universal/release-widget/mitibar \
            target/aarch64-apple-darwin/release-widget/mitibar \
            target/x86_64-apple-darwin/release-widget/mitibar
      - name: Package (Windows and Linux)
        if: matrix.os != 'macos-latest'
        run: cargo xtask package
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MITIBAR_BINARIES_DIR: target/universal/release-widget
        run: cargo xtask package
      # Signing is optional for 0.x. These steps are skipped unless the repository variable is
      # true, so an unsigned preview is never faked as signed (ADR-0012).
      - name: Sign Windows artifacts
        if: matrix.os == 'windows-latest' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_SHA1: ${{ secrets.WINDOWS_SIGNING_CERT_SHA1 }}
        run: |
          if (-not $env:SIGNING_CERT_SHA1) { throw "WINDOWS_SIGNING_ENABLED is true but WINDOWS_SIGNING_CERT_SHA1 is empty" }
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:SIGNING_CERT_SHA1 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
          }
      - name: Sign macOS artifacts
        if: matrix.os == 'macos-latest' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "::error::MACOS_SIGNING_ENABLED is true but MACOS_SIGNING_IDENTITY is empty"
            exit 1
          fi
          dmg="$(ls dist/*.dmg | head -n1)"
          # The .app lives inside the DMG; mount it, sign the bundle and rebuild the DMG. The
          # Developer ID and notarization secrets are only present when signing is enabled.
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -quiet
          app="$(find "$mountpoint" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach "$mountpoint" -quiet
          rm -rf "$mountpoint"
          xcrun notarytool submit "$dmg" --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path apps/mitibar/Cargo.toml --format json \
            --spec-version 1.5 --override-filename "MitiBar-${VERSION}"
          mkdir -p sbom
          find . -name "MitiBar-${VERSION}*.cdx.json" -print -quit | xargs -r -I{} cp {} sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error

  checksums:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  # Least privilege: id-token and attestations only on this job, never on build or release.
  attest:
    needs: [build, checksums, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

  release:
    needs: [preflight, checksums, attest]
    # A manual run on a branch never creates a release. A tag created by a human does; the
    # dry-run input only affects workflow_dispatch, where the default is true.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Build release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo xtask changelog mitibar "$VERSION" > notes.md
          if [[ "${{ vars.WINDOWS_SIGNING_ENABLED }}" != "true" || "${{ vars.MACOS_SIGNING_ENABLED }}" != "true" ]]; then
            printf '\n> This preview is unsigned. Windows SmartScreen and macOS Gatekeeper will warn.\n' >> notes.md
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          draft: true
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}
          files: artifacts/*
