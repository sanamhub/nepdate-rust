# Weekly sync of `shared/` with the hub (ADR-0003). Runs the hub's reusable workflow,
# pinned to a full hub commit SHA. The reusable workflow reads `vars.SYNC_APP_ID` and
# `secrets.SYNC_APP_PRIVATE_KEY` from this repository and opens one PR on `bot/shared-sync`.

name: shared-sync

on:
  schedule:
    # Weekly, Tuesday 03:15 UTC (hub data-update runbook).
    - cron: "15 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@827791325bf9c16258e5619dce5ecbd8e55e63e1 # main 2026-10-30
    with:
      regenerate: cargo xtask codegen
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
