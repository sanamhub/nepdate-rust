name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same channel, components and targets as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-nextest
      - run: cargo xtask ci

  # W0-04: the widget's own gate. Slint's MSRV is 1.92, satisfied by the 1.98 toolchain.
  # Linux needs winit's system libraries to link.
  widget:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo clippy -p nepdate-widget -- -D warnings
      - run: cargo test -p nepdate-widget

  # W0-03 follow-up: reproducible light and dark spike screenshots, written by the app itself
  # (Slint's Window::take_snapshot), uploaded for the human to look at. Ubuntu renders under
  # xvfb with Mesa's software GL; macOS and Windows runners have a desktop session.
  snapshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev libgl1 libegl1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Render light snapshot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p nepdate-widget --features snapshot -- --font-test --snapshot snapshot-light.png --theme light
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Render dark snapshot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p nepdate-widget --features snapshot -- --font-test --snapshot snapshot-dark.png --theme dark
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Render light snapshot (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo run -p nepdate-widget --features snapshot -- --font-test --snapshot snapshot-light.png --theme light
      - name: Render dark snapshot (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo run -p nepdate-widget --features snapshot -- --font-test --snapshot snapshot-dark.png --theme dark
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ matrix.os }}
          path: |
            snapshot-light.png
            snapshot-dark.png
          if-no-files-found: error

  # L6-06: fails when shared/ differs from the hub at the commit in shared/VERSION (ADR-0003).
  shared-check:
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@e2f977849877be6828e6d6ebbb638fcf708638e7

  # L6-03: not a `cargo xtask ci` step, because llvm-cov needs the llvm-tools component.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - run: cargo xtask coverage

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # rust-toolchain.toml pins the dev toolchain; this overrides it for the MSRV build.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ccee93717622f2100ea90b0833cbd1575c4c56b2 # 1.85
      - run: cargo build -p nepdate --all-features
      - run: cargo build -p nepdate-patro
