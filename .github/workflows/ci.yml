name: ci

on:
  push:
    branches: [main]
  pull_request:
  # shared-sync starts CI this way on the PR it opens with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same channel, components and targets as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-nextest
      - run: cargo xtask ci

  # Fails when shared/ differs from the hub at the commit in shared/VERSION (ADR-0003).
  shared-check:
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@e2f977849877be6828e6d6ebbb638fcf708638e7

  # Not a `cargo xtask ci` step, because llvm-cov needs the llvm-tools component.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: cargo xtask coverage

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # rust-toolchain.toml pins the dev toolchain; this overrides it for the MSRV build.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85"
      - run: cargo build -p nepdate --all-features
      - run: cargo build -p nepdate-patro
