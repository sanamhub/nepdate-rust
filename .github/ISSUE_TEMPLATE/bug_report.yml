name: Bug report
description: Something in nepdate, nepdate-patro or nepdate-widget doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Reproducing input
      description: The smallest code or steps that show the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: nepdate 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
