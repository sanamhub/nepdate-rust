[workspace]
resolver = "3"
members = ["crates/nepdate", "crates/nepdate-patro", "xtask", "benches/nepdate-bench", "apps/mitibar"]
default-members = ["crates/nepdate", "crates/nepdate-patro"]
exclude = ["fuzz"]                             # cargo-fuzz crate, needs nightly (L4-07)

[workspace.package]
edition = "2024"
license = "MIT"                                # ADR-0013
repository = "https://github.com/sanamhub/nepdate-rust"   # ADR-0002
rust-version = "1.85"                          # library MSRV (edition 2024 minimum)

[workspace.lints.rust]
unsafe_code = "deny"                           # the libraries forbid it in lib.rs; deny lets only the no_alloc test allocator opt out
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"                   # we add #[must_use] explicitly per ADR-0007
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"                      # forces .get() or proven-safe indexing with a comment

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
