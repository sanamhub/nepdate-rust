[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
# W4-04: parse the release workflow for the static test. A pure-Rust YAML 1.2 parser, not a
# regex, so comments and block scalars cannot fake a check, and not libyaml (unmaintained,
# RUSTSEC-2024-0449). xtask only; never in a shipped binary.
yaml-rust2 = { version = "0.13", default-features = false }
# Tray icon generation (W1-03): resvg re-exports usvg and tiny-skia. Both crates are already in
# the tree through Slint, so this adds no new crate.
resvg = { version = "0.48", default-features = false, features = ["text"] }
fontdb = "0.24"

[lints]
workspace = true
