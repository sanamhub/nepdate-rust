[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
# Parses the release workflow for the static test. A pure-Rust YAML 1.2 parser, not a
# regex, so comments and block scalars cannot fake a check, and not libyaml (unmaintained,
# RUSTSEC-2024-0449). xtask only; never in a shipped binary.
yaml-rust2 = { version = "0.13", default-features = false }
# Tray icon generation: resvg re-exports usvg and tiny-skia. Both crates are already in
# the tree through Slint, so this adds no new crate.
resvg = { version = "0.48", default-features = false, features = ["text"] }
fontdb = "0.24"

# Process memory, CPU time and thread count for the idle harness. Windows-only and
# xtask-only, the same `windows` family the app uses (ADR-0016); it never reaches a shipped
# binary.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
