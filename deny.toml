# cargo-deny configuration (L0-04). Slint's license exception is added in W0.

[graph]
all-features = true
# L6-02: the bench crate is publish = false, and two of its competitors are GPL; excluding
# unpublished crates keeps their licenses (which never reach users) out of the check.
exclude-unpublished = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "OFL-1.1", # fonts, widget
]
confidence-threshold = 0.9
unused-allowed-license = "allow" # the list covers later phases (fonts, Slint)

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
