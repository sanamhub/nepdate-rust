# cargo-deny configuration.

[graph]
all-features = true
# Exclude the benchmark crate and, with it, its GPL competitor dependencies (dev-only, never
# distributed).
exclude = ["nepdate-bench"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow" # the list covers optional dependencies

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
