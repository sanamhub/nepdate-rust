[package]
name = "nepdate"
version = "0.1.0-beta.1"
description = "Bikram Sambat (Nepali) calendar: fast, no_std, zero-dependency BS↔AD conversion"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sanamhub/nepdate-rust"
documentation = "https://docs.rs/nepdate"
rust-version.workspace = true
categories = ["date-and-time", "no-std", "localization"]
keywords = ["nepali", "bikram-sambat", "calendar", "date", "nepal"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "LICENSE-THIRD-PARTY", "CHANGELOG.md"]   # no shared/ or tests/

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]                          # ADR-0005
jiff = ["dep:jiff", "std"]                     # ADR-0011: conversions, today(), is_today()
chrono = ["dep:chrono"]                        # ADR-0005: conversions only

[dependencies]
serde = { version = "1", default-features = false, optional = true }
# Not `tz-system`: today asks for Asia/Kathmandu by name, never the system zone, and that
# feature's Windows import library needs an assembler the windows-gnu dev host doesn't have.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"], optional = true }
chrono = { version = "0.4", default-features = false, optional = true }

[[example]]
name = "convert"
required-features = ["jiff"]

[[test]]
name = "no_alloc"
harness = false

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["alloc", "no_std"] }
